  <div id="mnav" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-ink/95 backdrop-blur-xl border-t border-line px-1 pt-2 pb-3 flex justify-around"></div>
</div>

<div id="modal" class="hidden fixed inset-0 z-[60] bg-black/85 backdrop-blur-md flex items-center justify-center p-4"></div>
<div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[70] card px-4 py-2 text-xs border-brand/50"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}:${p2(m)}:${p2(s%60)}`:`${m}:${p2(s%60)}`};
const kmf=(k,d=1)=>Number(k).toFixed(d).replace('.',',');
const parseT=s=>{const p=s.trim().split(':').map(Number);return p.some(isNaN)||p.length<2||p.length>3?0:p.reduce((a,v)=>a*60+v,0)};
const quando=d=>{const t=new Date(d+'T12:00'),h=new Date();h.setHours(12,0,0,0);const n=Math.round((h-t)/864e5);return n<=0?'Hoje':n===1?'Ontem':t.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})};
const IN='w-full bg-[#0a1120] border border-line rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-brand';
const F=(n,l,a='')=>`<label class="block text-[11px] text-gray-400 mb-1">${l}</label><input name="${n}" ${a} class="${IN}">`;
const av=(n,f,c='w-10 h-10 text-sm')=>f?`<img src="${esc(f)}" alt="" class="${c} rounded-full object-cover border-2 border-brand/40">`:`<div class="${c} rounded-full bg-gradient-to-br from-brand to-brand2 flex items-center justify-center font-bold">${esc((n||'?')[0])}</div>`;
const st=(l,v)=>`<div class="text-center"><p class="text-lg font-bold">${v}</p><p class="text-[11px] text-gray-400">${l}</p></div>`;
const empty=t=>`<p class="text-center text-sm text-gray-500 py-16">${t}</p>`;
const head=(t,btn)=>`<div class="flex items-center justify-between"><h2 class="text-lg font-bold">${t}</h2>${btn||''}</div>`;
const pill=(on,t,fn)=>`<button onclick="${fn}" class="px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ${on?'bg-brand text-white':'bg-card border border-line text-gray-400'}">${t}</button>`;
const bar=(v,m)=>`<div class="h-2 bg-[#14203a] rounded-full overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-brand to-brand2" style="width:${Math.min(100,v/m*100)}%"></div></div>`;
const NIVEL={iniciante:'Iniciante',intermediario:'Intermediário',avancado:'Avançado'};
const TABS=[['home','Início','fa-house'],['explorar','Explorar','fa-compass'],['grupos','Corridas','fa-person-running'],['ranking','Ranking','fa-trophy'],['perfil','Perfil','fa-user']];
let token=localStorage.getItem('t'),me=null,cur='home',rk={d:10,c:'',g:false},fc=false;

async function api(path,o={}){
  const h={...(o.headers||{})};
  if(token)h.Authorization='Bearer '+token;
  if(o.json){h['Content-Type']='application/json';o.body=JSON.stringify(o.json)}
  const r=await fetch(path,{method:o.method,body:o.body,headers:h});
  if(r.status===401&&token){logout();return}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Verifique os dados enviados');
  return d;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),3000)}
function closeM(){$('#modal').classList.add('hidden')}
function modal(title,body,onOk,btn='Salvar'){
  $('#modal').innerHTML=`<div class="card p-5 w-full max-w-md space-y-3"><div class="flex justify-between items-center"><h3 class="font-bold">${title}</h3><button type="button" onclick="closeM()" aria-label="Fechar" class="text-gray-400"><i class="fa-solid fa-xmark"></i></button></div><form id="mf" class="space-y-3">${body}<button class="btn w-full py-2.5 text-sm">${btn}</button></form></div>`;
  $('#modal').classList.remove('hidden');
  $('#mf').onsubmit=async e=>{e.preventDefault();try{await onOk(new FormData(e.target));closeM()}catch(x){toast(x.message)}};
}

function showAuth(m='login'){
  const c=m==='cad';
  $('#auth').innerHTML=`<div class="card auth-card p-6 w-full max-w-sm space-y-4"><div class="text-center"><i class="fa-solid fa-person-running text-brand text-4xl"></i><h1 class="logo text-4xl mt-1">Run<span class="text-brand">Team</span></h1><p class="text-[10px] text-gray-400 tracking-[.2em] uppercase mt-1">Corra · Compita · Conecte-se</p></div><form id="af" class="space-y-3">${c?F('nome','Nome','required minlength="2"'):''}${F('email','E-mail','type="email" required')}${F('senha','Senha','type="password" required minlength="6"')}${c?F('cidade','Cidade','required'):''}<button class="btn w-full py-2.5 text-sm">${c?'Criar conta':'Entrar'}</button></form><button onclick="showAuth('${c?'login':'cad'}')" class="w-full text-xs text-gray-400 hover:text-brand">${c?'Já tenho conta':'Criar conta'}</button></div>`;
  $('#auth').classList.remove('hidden');
  $('#af').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{if(c)await api('/auth/cadastro',{method:'POST',json:d});await entrar(d.email,d.senha)}catch(x){toast(x.message)}};
}
async function entrar(email,senha){
  const r=await api('/auth/login',{method:'POST',body:new URLSearchParams({username:email,password:senha})});
  token=r.access_token;localStorage.setItem('t',token);await boot();
}
function logout(){parar();G=G0();localStorage.removeItem('rt_gps');localStorage.removeItem('t');token=null;me=null;$('#app').classList.add('hidden');showAuth()}
const refreshMe=async()=>{me=await api('/usuarios/me');setWho()};
function setWho(){$('#who').innerHTML=av(me.nome,me.foto_perfil,'w-9 h-9 text-xs');$('#adminBtn').classList.toggle('hidden',!me.is_admin)}
async function boot(){
  if(!token){showAuth();return}
  try{me=await api('/usuarios/me')}catch{logout();return}
  if(!me)return;
  setWho();$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');go('home');upd();
}

function nav(){
  $('#dnav').innerHTML=TABS.map(([k,l,i])=>`<button onclick="go('${k}')" class="px-4 py-2 rounded-full text-xs font-semibold flex items-center gap-2 ${k===cur?'bg-brand text-white':'text-gray-400 hover:text-white'}"><i class="fa-solid ${i}"></i>${l}</button>`).join('');
  $('#mnav').innerHTML=TABS.map(([k,l,i])=>`<button onclick="go('${k}')" class="flex flex-col items-center text-[11px] font-medium px-3 py-1 ${k===cur?'text-brand':'text-gray-500'}"><i class="fa-solid ${i} text-xl mb-1"></i>${l}</button>`).join('');
}
const views={home,explorar,grupos,ranking,perfil:()=>perfil(),admin,gravar};
async function go(t){cur=t;nav();upd();$('#view').innerHTML=empty('Carregando...');scrollTo(0,0);try{await views[t]()}catch(e){toast(e.message)}}

const ring=(km,meta=10)=>{const r=88,c=2*Math.PI*r,p=Math.min(1,km/meta);return `<div class="relative w-52 h-52 mx-auto"><svg viewBox="0 0 200 200" class="w-full h-full -rotate-90"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e90ff"/><stop offset="1" stop-color="#19d3c5"/></linearGradient></defs><circle cx="100" cy="100" r="${r}" fill="none" stroke="#14203a" stroke-width="10"/><circle cx="100" cy="100" r="${r}" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*p} ${c}"/></svg><div class="absolute inset-0 flex flex-col items-center justify-center"><i class="fa-solid fa-person-running text-brand text-xl mb-1"></i><p class="text-4xl font-bold">${kmf(km,2)}<span class="text-lg font-medium"> km</span></p><p class="text-xs text-gray-400">Distância</p></div></div>`};

async function home(){
  const [it,ads]=await Promise.all([api('/feed'+(fc?'?cidade='+encodeURIComponent(me.cidade):'')),getAds()]);
  const m=it.find(c=>c.usuario_id===me.id);
  $('#view').innerHTML=`<section class="card p-5"><p class="text-xs text-gray-400 text-center mb-3">${m?'Sua última corrida':'Registre sua primeira corrida'}</p>${ring(m?m.distancia_km:0)}
  <div class="grid grid-cols-3 mt-5">${st('Tempo',m?fmt(m.tempo_seg):'--')}${st('Pace (min/km)',m?fmt(m.pace_seg_km):'--')}${st('Km total',kmf(me.km_total))}</div>
  <button onclick="go('gravar')" class="btn w-full py-3 mt-5 text-sm"><i class="fa-solid fa-satellite-dish"></i> Iniciar corrida com GPS</button><button onclick="novaCorrida()" class="w-full mt-2 py-2 text-xs text-gray-400">Registrar manualmente</button></section>
  <div class="flex gap-2 pt-2">${pill(!fc,'Todos','fc=false;home()')}${pill(fc,'Minha cidade','fc=true;home()')}</div>`
  +(it.length?it.map((c,i)=>`<article class="card p-4 space-y-3">
    <button onclick="perfil(${c.usuario_id})" class="flex items-center gap-3 text-left w-full">${av(c.atleta,c.atleta_foto,'w-11 h-11')}<div><p class="font-semibold text-sm">${esc(c.atleta)}</p><p class="text-[11px] text-gray-400">${quando(c.data)} · Corrida</p></div></button>
    ${c.legenda?`<p class="text-sm">${esc(c.legenda)}</p>`:''}
    ${c.fotos.map(f=>`<img src="${esc(f)}" alt="Foto da corrida" class="w-full rounded-2xl max-h-80 object-cover">`).join('')}
    ${c.trajeto&&c.trajeto.length>1?`<div class="rounded-2xl bg-[#0a1120] p-2">${rota(c.trajeto,120)}</div>`:''}<div class="flex flex-wrap gap-2 text-xs"><span class="bg-[#14203a] rounded-full px-3 py-1"><i class="fa-solid fa-route text-brand"></i> ${kmf(c.distancia_km)} km</span><span class="bg-[#14203a] rounded-full px-3 py-1"><i class="fa-regular fa-clock text-brand"></i> ${fmt(c.tempo_seg)}</span><span class="bg-[#14203a] rounded-full px-3 py-1"><i class="fa-solid fa-gauge-high text-brand"></i> ${fmt(c.pace_seg_km)}/km</span>${c.origem==='gps'?'<span class="bg-[#14203a] rounded-full px-3 py-1"><i class="fa-solid fa-satellite-dish text-brand"></i> GPS</span>':''}</div>
    <div class="flex justify-between text-gray-400 text-sm"><button onclick="curtir(${c.id},this)"><i class="fa-regular fa-heart"></i> <span>${c.curtidas}</span></button>${adminDel('corridas',c.id)}<button aria-label="Compartilhar" data-t="${esc(c.atleta)} correu ${kmf(c.distancia_km)} km em ${fmt(c.tempo_seg)} no RunTeam!" onclick="compartilhar(this.dataset.t)"><i class="fa-solid fa-share-nodes"></i></button></div></article>${i%4===1&&ads.length?adCard(ads[Math.floor(i/4)%ads.length]):''}`).join(''):empty('Nenhuma corrida ainda. Seja o primeiro!'));contaAds();
}
async function curtir(id,b){
  try{const r=await api(`/corridas/${id}/curtir`,{method:'POST'}),s=b.querySelector('span');
  s.textContent=+s.textContent+(r.curtiu?1:-1);b.classList.toggle('text-red-500',r.curtiu);b.querySelector('i').className=(r.curtiu?'fa-solid':'fa-regular')+' fa-heart'}catch(e){toast(e.message)}
}
function compartilhar(t){navigator.share?navigator.share({title:'RunTeam',text:t,url:location.origin}).catch(()=>{}):navigator.clipboard?.writeText(t+' '+location.origin).then(()=>toast('Texto copiado!'))}
function novaCorrida(){
  modal('Registrar corrida',F('d','Distância (km)','type="number" step="0.01" min="0.1" required')+F('t','Tempo (mm:ss ou h:mm:ss)','placeholder="52:14" required')+F('l','Legenda','placeholder="Mais um treino concluído!"')+F('f','Foto','type="file" accept="image/*"'),async fd=>{
    const t=parseT(fd.get('t'));if(!t)throw new Error('Tempo inválido. Use o formato 52:14');
    const c=await api('/corridas',{method:'POST',json:{distancia_km:+fd.get('d'),tempo_seg:t,legenda:fd.get('l')||null}});
    const f=fd.get('f');if(f&&f.size){const b=new FormData();b.append('arquivo',f);await api(`/corridas/${c.id}/fotos`,{method:'POST',body:b})}
    await refreshMe();go('home');
  },'Publicar');
}

async function ranking(){
  const q=new URLSearchParams({distancia_km:rk.d});if(rk.c)q.set('cidade',rk.c);if(rk.g)q.set('somente_gps','true');
  const it=await api('/ranking?'+q);
  const medal=['text-amber-400','text-gray-300','text-orange-500'];
  $('#view').innerHTML=head('Ranking')+`<div class="flex gap-2 overflow-x-auto">${[5,10,21].map(d=>pill(rk.d===d,d+' km',`rk.d=${d};ranking()`)).join('')}${pill(rk.g,'<i class="fa-solid fa-satellite-dish"></i> Só GPS','rk.g=!rk.g;ranking()')}</div>
   <input value="${esc(rk.c)}" onchange="rk.c=this.value.trim();ranking()" placeholder="Filtrar por cidade (vazio = todas)" class="${IN}">`
   +(it.length?`<div class="card divide-y divide-line">${it.map(r=>`<button onclick="perfil(${r.usuario_id})" class="p-3 flex items-center gap-3 w-full text-left"><span class="w-7 text-center font-bold">${r.posicao<=3?`<i class="fa-solid fa-medal text-xl ${medal[r.posicao-1]}"></i>`:r.posicao}</span>${av(r.nome,r.foto,'w-10 h-10 text-sm')}<span class="flex-1 text-sm font-semibold">${esc(r.nome)}</span><span class="font-bold text-sm">${fmt(r.tempo_seg)}</span></button>`).join('')}</div>`:empty('Ninguém no ranking desta distância ainda.'));
}

async function grupos(){
  const it=await api('/turmas?cidade='+encodeURIComponent(me.cidade));
  $('#view').innerHTML=head('Corrida em Grupo',`<button onclick="novaTurma()" class="btn text-xs px-4 py-2"><i class="fa-solid fa-plus"></i> Criar chamado</button>`)
  +(it.length?it.map(t=>`<div class="card p-4 space-y-3"><div class="flex justify-between items-start"><div><p class="font-semibold">${esc(t.local)}</p><p class="text-[11px] text-gray-400"><i class="fa-regular fa-calendar text-brand"></i> ${new Date(t.horario).toLocaleString('pt-BR',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</p></div><span class="text-[10px] bg-brand/15 text-brand px-3 py-1 rounded-full font-semibold">${NIVEL[t.nivel]||esc(t.nivel)}</span></div>${bar(t.inscritos,t.vagas)}
   <div class="flex justify-between items-center"><span class="text-[11px] text-gray-400"><i class="fa-solid fa-users"></i> ${t.inscritos} de ${t.vagas} vagas</span><div class="flex items-center gap-1">${adminDel('turmas',t.id)}<button onclick="entrarTurma(${t.id})" class="btn text-xs px-5 py-2">Entrar</button></div></div></div>`).join(''):empty('Nenhuma turma marcada na sua cidade. Crie a primeira!'));
}
async function entrarTurma(id){try{await api(`/turmas/${id}/entrar`,{method:'POST'});toast('Você entrou na turma!');grupos()}catch(e){toast(e.message)}}
function novaTurma(){
  modal('Criar chamado',F('local','Local','placeholder="Parque Municipal" required')+F('horario','Data e hora','type="datetime-local" required')+`<label class="block text-[11px] text-gray-400 mb-1">Nível</label><select name="nivel" class="${IN}">${Object.entries(NIVEL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`+F('vagas','Vagas','type="number" min="2" max="200" value="10" required'),async fd=>{
    await api('/turmas',{method:'POST',json:{local:fd.get('local'),horario:fd.get('horario'),nivel:fd.get('nivel'),vagas:+fd.get('vagas')}});grupos();
  },'Publicar');
}

async function explorar(){
  const [it,ads]=await Promise.all([api('/campeonatos?cidade='+encodeURIComponent(me.cidade)),getAds()]);
  $('#view').innerHTML=head('Explorar',`<button onclick="novoEvento()" class="btn text-xs px-4 py-2"><i class="fa-solid fa-plus"></i> Divulgar</button>`)+`<p class="text-xs text-gray-400">Campeonatos e provas em ${esc(me.cidade)}</p>${ads[0]?adCard(ads[0]):''}`
  +(it.length?it.map(c=>`<div class="card p-4 flex items-center gap-3"><div class="w-14 h-14 rounded-2xl bg-brand/15 flex flex-col items-center justify-center"><span class="font-bold text-lg text-brand leading-none">${c.data.slice(8,10)}</span><span class="text-[10px] text-gray-400 uppercase">${new Date(c.data+'T12:00').toLocaleString('pt-BR',{month:'short'})}</span></div><div class="flex-1"><p class="font-semibold text-sm">${esc(c.nome)}</p><p class="text-[11px] text-gray-400">${esc(c.cidade)}</p></div>${adminDel('campeonatos',c.id)}${c.link&&/^https?:\/\//.test(c.link)?`<a href="${esc(c.link)}" target="_blank" rel="noopener" class="text-xs text-brand font-semibold">Inscrição <i class="fa-solid fa-arrow-up-right-from-square"></i></a>`:''}</div>`).join(''):empty('Nenhum campeonato divulgado na sua cidade.'));contaAds();
}
function novoEvento(){
  modal('Divulgar campeonato',F('nome','Nome','required')+F('cidade','Cidade',`value="${esc(me.cidade)}" required`)+F('data','Data','type="date" required')+F('link','Link de inscrição (opcional)','type="url" placeholder="https://"'),async fd=>{
    await api('/campeonatos',{method:'POST',json:{nome:fd.get('nome'),cidade:fd.get('cidade'),data:fd.get('data'),link:fd.get('link')||null}});explorar();
  },'Publicar');
}

async function fotoPerfil(f){
  if(!f)return;
  if(f.size>5*1024*1024){toast('A foto deve ter até 5 MB');return}
  const b=new FormData();b.append('arquivo',f);
  try{const r=await api('/usuarios/me/foto',{method:'POST',body:b});me.foto_perfil=r.url;setWho();perfil()}catch(e){toast(e.message)}
}
async function perfil(id){
  id=id||me.id;const u=await api('/usuarios/'+id),own=id===me.id;
  const nv=Math.floor(u.km_total/50)+1,conq=[['Primeira corrida','fa-shoe-prints',u.total_corridas>=1],['10 corridas','fa-fire',u.total_corridas>=10],['50 km','fa-road',u.km_total>=50],['100 km','fa-medal',u.km_total>=100],['Fotógrafo','fa-camera',u.fotos.length>=1]];
  $('#view').innerHTML=`<section class="card p-5 space-y-5"><div class="flex items-center gap-4">${own?`<label class="relative cursor-pointer" title="Trocar foto de perfil">${av(u.nome,u.foto_perfil,'w-20 h-20 text-2xl')}<span class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-brand flex items-center justify-center text-xs"><i class="fa-solid fa-camera"></i></span><input type="file" accept="image/*" class="hidden" onchange="fotoPerfil(this.files[0])"></label>`:av(u.nome,u.foto_perfil,'w-20 h-20 text-2xl')}<div><h2 class="text-lg font-bold">${esc(u.nome)}</h2><p class="text-xs text-gray-400">${esc(u.esporte)} · ${esc(u.cidade)}</p></div></div>
  <div class="space-y-1.5"><div class="flex justify-between text-xs"><span class="font-semibold"><i class="fa-solid fa-bolt text-brand"></i> Nível ${nv}</span><span class="text-gray-400">${kmf(u.km_total%50)} / 50 km</span></div>${bar(u.km_total%50,50)}</div>
  <div class="grid grid-cols-3">${st('Corridas',u.total_corridas)}${st('Distância',kmf(u.km_total)+' km')}${st('Média',u.total_corridas?kmf(u.km_total/u.total_corridas)+' km':'--')}</div></section>
  <section class="card p-5 space-y-3"><h3 class="font-bold text-sm">Conquistas</h3><div class="flex justify-between">${conq.map(([n,i,ok])=>`<div class="text-center w-16" title="${n}"><div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-lg ${ok?'bg-brand/20 text-brand border border-brand/50':'bg-[#14203a] text-gray-600'}"><i class="fa-solid ${i}"></i></div><p class="text-[10px] mt-1 ${ok?'text-gray-200':'text-gray-600'}">${n}</p></div>`).join('')}</div></section>
  <section class="card p-5 space-y-3"><h3 class="font-bold text-sm">Metas</h3><div class="space-y-1.5"><div class="flex justify-between text-xs"><span>Chegar a 100 km</span><span class="text-gray-400">${kmf(Math.min(u.km_total,100))}/100 km</span></div>${bar(u.km_total,100)}</div><div class="space-y-1.5"><div class="flex justify-between text-xs"><span>Completar 10 corridas</span><span class="text-gray-400">${Math.min(u.total_corridas,10)}/10</span></div>${bar(u.total_corridas,10)}</div></section>
  ${u.fotos.length?`<div class="grid grid-cols-3 gap-1.5">${u.fotos.map(f=>`<img src="${esc(f)}" alt="Foto" class="aspect-square object-cover rounded-2xl">`).join('')}</div>`:''}
  ${own?`<button onclick="logout()" class="text-xs text-gray-500 hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>`:''}`;
}
/* ---------- Anúncios ---------- */
const adCard=a=>{const ok=/^https?:\/\//.test(a.link);return `<article data-ad="${a.id}" class="card p-4 space-y-3 border-brand/30"><div class="flex items-center justify-between"><span class="text-[10px] font-semibold text-brand bg-brand/15 px-2 py-0.5 rounded-full">Patrocinado</span><span class="text-[11px] text-gray-500">${esc(a.anunciante)}</span></div>${a.imagem?`<img src="${esc(a.imagem)}" alt="" class="w-full rounded-2xl max-h-60 object-cover">`:''}<div><p class="font-semibold text-sm">${esc(a.titulo)}</p>${a.texto?`<p class="text-xs text-gray-400 mt-1">${esc(a.texto)}</p>`:''}</div><a href="${ok?esc(a.link):'#'}" target="_blank" rel="noopener sponsored" onclick="cliqueAd(${a.id})" class="btn block text-center text-xs py-2.5">Saiba mais</a></article>`};
const contaAds=()=>document.querySelectorAll('#view [data-ad]').forEach(e=>fetch(`/anuncios/${e.dataset.ad}/impressao`,{method:'POST'}).catch(()=>{}));
const cliqueAd=id=>fetch(`/anuncios/${id}/clique`,{method:'POST',keepalive:true}).catch(()=>{});
const getAds=()=>api('/anuncios?cidade='+encodeURIComponent(me.cidade)).catch(()=>[]);

/* ---------- Administração ---------- */
const adminDel=(t,id)=>me.is_admin?`<button onclick="excluir('${t}',${id})" aria-label="Excluir (admin)" class="text-red-400 px-2"><i class="fa-solid fa-trash"></i></button>`:'';
async function excluir(tipo,id){
  if(!confirm('Excluir definitivamente?'))return;
  try{await api(`/admin/${tipo}/${id}`,{method:'DELETE'});toast('Excluído');go(cur)}catch(e){toast(e.message)}
}
let adm='resumo',bq='';
const dbr=d=>d?d.split('-').reverse().join('/'):null;
const ctrF=(c,i)=>i?(c/i*100).toFixed(1).replace('.',',')+'%':'--';
async function admin(){
  if(!me.is_admin){$('#view').innerHTML=empty('Acesso restrito a administradores.');return}
  const top=head('<i class="fa-solid fa-shield-halved text-brand"></i> Administração')+`<div class="flex gap-2">${[['resumo','Resumo'],['anuncios','Anúncios'],['usuarios','Usuários']].map(([k,l])=>pill(adm===k,l,`adm='${k}';admin()`)).join('')}</div>`;
  let body='';
  if(adm==='resumo'){
    const r=await api('/admin/resumo');
    body=`<div class="grid grid-cols-2 gap-3">${[['Atletas',r.usuarios,'fa-users'],['Corridas',r.corridas,'fa-person-running'],['Km percorridos',kmf(r.km_total),'fa-route'],['Turmas',r.turmas,'fa-people-group'],['Campeonatos',r.campeonatos,'fa-flag-checkered'],['Anúncios ativos',r.anuncios_ativos,'fa-bullhorn'],['Impressões',r.impressoes,'fa-eye'],['Cliques (CTR '+ctrF(r.cliques,r.impressoes)+')',r.cliques,'fa-hand-pointer']].map(([l,v,i])=>`<div class="card p-4"><i class="fa-solid ${i} text-brand"></i><p class="text-2xl font-bold mt-2">${v}</p><p class="text-[11px] text-gray-400">${l}</p></div>`).join('')}</div>`;
  }else if(adm==='anuncios'){
    const it=await api('/admin/anuncios');
    body=`<button onclick="novoAnuncio()" class="btn w-full py-2.5 text-sm"><i class="fa-solid fa-plus"></i> Novo anúncio</button>`+(it.length?it.map(a=>`<div class="card p-4 space-y-3"><div class="flex gap-3">${a.imagem?`<img src="${esc(a.imagem)}" alt="" class="w-16 h-16 rounded-xl object-cover">`:`<div class="w-16 h-16 rounded-xl bg-brand/15 text-brand flex items-center justify-center text-xl"><i class="fa-solid fa-bullhorn"></i></div>`}<div class="flex-1 min-w-0"><p class="font-semibold text-sm truncate">${esc(a.titulo)}</p><p class="text-[11px] text-gray-400 truncate">${esc(a.anunciante)} · ${a.cidade?esc(a.cidade):'Todas as cidades'}</p><p class="text-[11px] text-gray-500">${dbr(a.inicio)||'sem início'} → ${dbr(a.fim)||'sem fim'}</p></div><span class="text-[10px] h-fit px-2 py-0.5 rounded-full font-semibold ${a.ativo?'bg-emerald-500/15 text-emerald-400':'bg-gray-500/20 text-gray-400'}">${a.ativo?'Ativo':'Pausado'}</span></div><div class="grid grid-cols-3">${st('Impressões',a.impressoes)}${st('Cliques',a.cliques)}${st('CTR',ctrF(a.cliques,a.impressoes))}</div><div class="flex gap-2"><button onclick="alternarAd(${a.id})" class="flex-1 py-2 rounded-xl border border-line text-xs">${a.ativo?'Pausar':'Ativar'}</button><button onclick="excluir('anuncios',${a.id})" aria-label="Excluir anúncio" class="px-4 py-2 rounded-xl border border-red-500/40 text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button></div></div>`).join(''):empty('Nenhum anúncio criado ainda.'));
  }else{
    const it=await api('/admin/usuarios'+(bq?'?q='+encodeURIComponent(bq):''));
    body=`<input value="${esc(bq)}" onchange="bq=this.value.trim();admin()" placeholder="Buscar por nome ou e-mail" class="${IN}">`+it.map(u=>`<div class="card p-3 flex items-center gap-3">${av(u.nome,u.foto,'w-10 h-10 text-sm')}<div class="flex-1 min-w-0"><p class="text-sm font-semibold truncate">${esc(u.nome)} ${u.is_admin?'<span class="text-[10px] text-brand">ADMIN</span>':''}${u.ativo?'':'<span class="text-[10px] text-red-400">SUSPENSO</span>'}</p><p class="text-[11px] text-gray-400 truncate">${esc(u.email)} · ${esc(u.cidade)}</p></div>${u.is_admin?'':`<button onclick="suspender(${u.id})" class="text-xs px-3 py-1.5 rounded-xl border ${u.ativo?'border-red-500/40 text-red-400':'border-emerald-500/40 text-emerald-400'}">${u.ativo?'Suspender':'Reativar'}</button>`}</div>`).join('');
  }
  $('#view').innerHTML=top+body;
}
function novoAnuncio(){
  modal('Novo anúncio',F('anunciante','Anunciante','required maxlength="100"')+F('titulo','Título','required maxlength="120"')+F('texto','Texto (opcional)','maxlength="300"')+F('link','Link de destino','type="url" placeholder="https://" required')+F('cidade','Cidade (vazio = todas)')+`<div class="grid grid-cols-2 gap-2"><div>${F('inicio','Início','type="date"')}</div><div>${F('fim','Fim','type="date"')}</div></div>`+F('imagem','Imagem (opcional)','type="file" accept="image/*"'),async fd=>{
    for(const [k,v] of [...fd.entries()])if(v===''||(v instanceof File&&!v.size))fd.delete(k);
    await api('/admin/anuncios',{method:'POST',body:fd});admin();
  },'Criar anúncio');
}
async function alternarAd(id){try{await api(`/admin/anuncios/${id}/alternar`,{method:'POST'});admin()}catch(e){toast(e.message)}}
async function suspender(id){try{await api(`/admin/usuarios/${id}/suspender`,{method:'POST'});admin()}catch(e){toast(e.message)}}
/* ---------- GPS ---------- */
const hav=(a,b)=>{const r=Math.PI/180,x=(b[0]-a[0])*r,y=(b[1]-a[1])*r,q=Math.sin(x/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(q))};
function rota(pts,h=150){
  const la=pts.map(p=>p[0]),lo=pts.map(p=>p[1]),a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo);
  const k=Math.cos((a+b)/2*Math.PI/180),W=300,pad=14,sx=Math.max(d-c,1e-6)*k,sy=Math.max(b-a,1e-6),sc=Math.min((W-2*pad)/sx,(h-2*pad)/sy),ox=(W-sx*sc)/2,oy=(h-sy*sc)/2;
  const X=p=>(ox+(p[1]-c)*k*sc).toFixed(1),Y=p=>(oy+(b-p[0])*sc).toFixed(1),s=pts[0],e=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${h}" class="w-full" style="max-height:${h}px" role="img" aria-label="Trajeto da corrida"><path d="${pts.map((p,i)=>(i===0||p[2]?'M':'L')+X(p)+' '+Y(p)).join(' ')}" fill="none" stroke="#ff6a13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(s)}" cy="${Y(s)}" r="5" fill="#19d3c5"/><circle cx="${X(e)}" cy="${Y(e)}" r="5" fill="#fff" stroke="#ff6a13" stroke-width="2"/></svg>`;
}
const G0=()=>({st:'idle',pts:[],km:0,ms:0,t0:0,tu:0,lt:0,gap:false,prec:null,err:''});
let G=Object.assign(G0(),JSON.parse(localStorage.getItem('rt_gps')||'{}')),gid=null,gint=null,wl=null;
if(G.st==='rec'){G.ms+=Math.max(0,(G.tu||G.t0)-G.t0);G.st='pause'}   // página recarregada durante a corrida: volta pausada
const salvaG=()=>{G.tu=Date.now();try{localStorage.setItem('rt_gps',JSON.stringify(G))}catch{}};
async function travaTela(){try{wl=await navigator.wakeLock?.request('screen')}catch{}}
function liberaTela(){try{wl?.release().catch(()=>{})}catch{}wl=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&G.st==='rec'&&!wl)travaTela()});
addEventListener('beforeunload',e=>{if(G.st==='rec'||G.st==='pause'){e.preventDefault();e.returnValue=''}});
function parar(){if(gid!=null)navigator.geolocation.clearWatch(gid);gid=null;clearInterval(gint);liberaTela()}
function onPos(p){
  const c=p.coords;G.prec=Math.round(c.accuracy);
  if(G.st!=='rec'||c.accuracy>35){upd();return}                    // sinal fraco: ignora o ponto
  const pt=[+c.latitude.toFixed(6),+c.longitude.toFixed(6)],l=G.pts[G.pts.length-1];
  if(l&&!G.gap){
    const d=hav(l,pt)*1000,dt=(p.timestamp-G.lt)/1000;
    if(d<Math.max(5,c.accuracy*.5)||(dt>0&&d/dt>12))return;       // parado/ruído ou salto impossível (>43 km/h)
    G.km+=d/1000;
  }
  G.pts.push(G.gap?[...pt,1]:pt);G.gap=false;G.lt=p.timestamp;salvaG();upd();
}
function onErr(e){
  G.err=e.code===1?'Permissão de localização negada. Libere o GPS para este site nas configurações do navegador.':e.code===2?'Sinal de GPS indisponível. Vá para um local aberto.':'O GPS demorou para responder.';
  if(e.code===1&&G.st==='rec'){G.ms+=Date.now()-G.t0;G.st=G.pts.length?'pause':'idle';parar();salvaG()}
  upd();if(cur==='gravar')gravar();
}
function iniciar(){
  if(!navigator.geolocation){G.err='Este navegador não tem GPS.';return}
  if(!isSecureContext){G.err='O GPS só funciona em https ou em localhost.';return}
  parar();G.err='';G.st='rec';G.t0=Date.now();G.gap=G.pts.length>0;
  gid=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  gint=setInterval(upd,1000);travaTela();salvaG();
}
function pausar(){G.ms+=Date.now()-G.t0;G.st='pause';parar();salvaG();gravar()}
function finalizar(){if(G.st==='rec')G.ms+=Date.now()-G.t0;G.st='fim';parar();salvaG();gravar()}
function descartarG(){if(!confirm('Descartar esta corrida?'))return;parar();G=G0();localStorage.removeItem('rt_gps');go('home')}
function upd(){
  const ms=G.ms+(G.st==='rec'?Date.now()-G.t0:0),s=Math.floor(ms/1000),pace=G.km>0.02?Math.round(s/G.km):0,rb=$('#recbar');
  if(G.st==='rec'||G.st==='pause'){rb.textContent=`${G.st==='rec'?'● Gravando':'Ⅱ Pausada'} · ${kmf(G.km,2)} km · ${fmt(s)}`;rb.classList.toggle('hidden',cur==='gravar')}else rb.classList.add('hidden');
  if(cur!=='gravar')return;
  const set=(i,h)=>{const e=$('#'+i);if(e)e.innerHTML=h};
  set('g-ring',ring(G.km,Math.max(5,Math.ceil(G.km/5)*5)));set('g-t',fmt(s));set('g-p',pace?fmt(pace):'--');set('g-prec',G.prec==null?'--':'±'+G.prec+' m');
  set('g-rota',G.pts.length>1?rota(G.pts):'<p class="text-xs text-gray-500 text-center py-6">O trajeto aparece aqui enquanto você corre.</p>');
  set('g-err',esc(G.err));
}
function gravar(){
  const v=$('#view'),s=Math.round(G.ms/1000),pc=G.km>0.02?Math.round(s/G.km):0;
  if(G.st==='fim'){
    const curta=G.km<0.1||s<30;
    v.innerHTML=`<section class="card p-5 space-y-4"><h2 class="text-lg font-bold text-center">Corrida concluída!</h2>${G.pts.length>1?`<div class="rounded-2xl bg-[#0a1120] p-2">${rota(G.pts)}</div>`:''}<div class="grid grid-cols-3">${st('Distância',kmf(G.km,2)+' km')}${st('Tempo',fmt(s))}${st('Pace',pc?fmt(pc)+'/km':'--')}</div>${curta?'<p class="text-xs text-gray-400 text-center">Corrida muito curta para publicar.</p>':`<form id="gf" class="space-y-3">${F('l','Legenda','placeholder="Mais um treino concluído!"')}${F('f','Foto','type="file" accept="image/*"')}<button class="btn w-full py-3 text-sm">Publicar corrida</button></form>`}<button onclick="descartarG()" class="w-full text-xs text-gray-500">Descartar</button></section>`;
    if($('#gf'))$('#gf').onsubmit=publicarG;return;
  }
  const bt=G.st==='idle'?`<button onclick="iniciar();gravar()" class="btn w-full py-3 text-sm"><i class="fa-solid fa-play"></i> Iniciar</button>`:`<div class="flex gap-2">${G.st==='rec'?`<button onclick="pausar()" class="flex-1 py-3 rounded-xl border border-brand text-brand text-sm font-semibold"><i class="fa-solid fa-pause"></i> Pausar</button>`:`<button onclick="iniciar();gravar()" class="btn flex-1 py-3 text-sm"><i class="fa-solid fa-play"></i> Retomar</button>`}<button onclick="if(confirm('Finalizar a corrida?'))finalizar()" class="flex-1 py-3 rounded-xl border border-line text-sm">Finalizar</button></div>`;
  v.innerHTML=`<section class="card p-5 space-y-4 text-center"><p class="text-xs text-gray-400">${G.st==='idle'?'Pronto para correr?':G.st==='rec'?'Gravando sua corrida':'Corrida pausada'}</p><div id="g-ring"></div><div class="grid grid-cols-3"><div><p id="g-t" class="text-lg font-bold">0:00</p><p class="text-[11px] text-gray-400">Tempo</p></div><div><p id="g-p" class="text-lg font-bold">--</p><p class="text-[11px] text-gray-400">Pace (min/km)</p></div><div><p id="g-prec" class="text-lg font-bold">--</p><p class="text-[11px] text-gray-400">Precisão GPS</p></div></div><div id="g-rota" class="rounded-2xl bg-[#0a1120] p-2"></div>${!isSecureContext?'<p class="text-xs text-amber-400">O navegador só libera o GPS em páginas https ou em localhost. No celular, abra o app por um endereço https.</p>':''}<p id="g-err" class="text-xs text-red-400"></p>${bt}</section>${G.st==='rec'?'<p class="text-[11px] text-gray-500 text-center">Mantenha esta tela aberta: a tela do celular fica ligada enquanto você corre.</p>':''}`;
  upd();
}
async function publicarG(e){
  e.preventDefault();const fd=new FormData(e.target),s=Math.round(G.ms/1000);
  try{
    const c=await api('/corridas',{method:'POST',json:{distancia_km:Math.max(.01,+G.km.toFixed(2)),tempo_seg:s,legenda:fd.get('l')||null,trajeto:G.pts}});
    const f=fd.get('f');if(f&&f.size){try{const b=new FormData();b.append('arquivo',f);await api(`/corridas/${c.id}/fotos`,{method:'POST',body:b})}catch{toast('Corrida publicada, mas a foto não foi enviada.')}}
    G=G0();localStorage.removeItem('rt_gps');await refreshMe();go('home');
  }catch(x){toast(x.message)}
}
function escolher(){
  $('#modal').innerHTML=`<div class="card p-5 w-full max-w-sm space-y-3"><div class="flex justify-between items-center"><h3 class="font-bold">Registrar corrida</h3><button type="button" onclick="closeM()" aria-label="Fechar" class="text-gray-400"><i class="fa-solid fa-xmark"></i></button></div><button onclick="closeM();go('gravar')" class="btn w-full py-3 text-sm"><i class="fa-solid fa-satellite-dish"></i> Gravar com GPS</button><button onclick="closeM();novaCorrida()" class="w-full py-3 text-sm rounded-xl border border-line">Registrar manualmente</button></div>`;
  $('#modal').classList.remove('hidden');
}
boot();
</script>
</body>
